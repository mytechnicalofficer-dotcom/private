<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marcello’s Private Schedule</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#f6f2e9;--card:#fffdf8;--ink:#14213d;--mute:#6b7280;--line:#e2d9c3;--navy:#0f1d3a;--gold:#b8923a;--goldsoft:#f3e8c8;--green:#2f7d5b;--amber:#c98a1b;--red:#a63a3a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0b1226;--card:#131c36;--ink:#f1ead7;--mute:#9aa3b8;--line:#2a3558;--navy:#070d1f;--gold:#d4af5a;--goldsoft:#2a2a3a;--green:#4fb48a;--amber:#e0a43a;--red:#d76a6a}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0b1226;--card:#131c36;--ink:#f1ead7;--mute:#9aa3b8;--line:#2a3558;--navy:#070d1f;--gold:#d4af5a;--goldsoft:#2a2a3a;--green:#4fb48a;--amber:#e0a43a;--red:#d76a6a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:14px}
header{background:var(--navy);color:#f1ead7;padding:16px 24px 0;border-bottom:3px solid var(--gold)}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
h1{font-family:'Cormorant Garamond',Georgia,serif;font-size:32px;margin:0;letter-spacing:.04em;color:#e3c777}
h1 small{display:block;font-family:Inter,sans-serif;font-size:11px;letter-spacing:.25em;text-transform:uppercase;color:#aab3c9;font-weight:500}
#sync{font-size:12px;color:#aab3c9}
#sync.ok{color:#7fd1a8}#sync.err{color:#e59a9a}
.tabs{display:flex;gap:4px;margin-top:14px;overflow-x:auto}
.tab{border:0;border-radius:8px 8px 0 0;padding:10px 20px;color:#aab3c9;background:transparent;font-family:'Cormorant Garamond',Georgia,serif;font-size:19px;font-weight:700;letter-spacing:.03em;white-space:nowrap}
.tab.on{background:var(--bg);color:var(--ink)}
.tab .n{background:var(--red);color:#fff;border-radius:10px;font:600 11px Inter,sans-serif;padding:1px 7px;margin-left:6px}
.nav{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.range{font-family:'Cormorant Garamond',Georgia,serif;font-size:22px;min-width:220px;text-align:center}
button{font:inherit;cursor:pointer;border-radius:6px;border:1px solid var(--gold);background:transparent;color:inherit;padding:6px 12px}
button.gold{background:var(--gold);color:#0f1d3a;font-weight:600}
main{padding:20px 24px;max-width:1500px;margin:auto}
.page{display:none}.page.on{display:block}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
h2{font-family:'Cormorant Garamond',Georgia,serif;font-size:22px;margin:0 0 10px;border-bottom:1px solid var(--gold);padding-bottom:6px}
label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin:8px 0 3px}
input,select,textarea{width:100%;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
textarea{min-height:55vh;resize:vertical;line-height:1.6}
.form{display:grid;grid-template-columns:2fr 1fr 1.2fr auto;gap:10px;align-items:end}
.form label{margin-top:0}
@media(max-width:760px){.form{grid-template-columns:1fr 1fr}main{padding:14px}}
.week{display:grid;grid-template-columns:repeat(7,minmax(140px,1fr));gap:10px;overflow-x:auto;padding-bottom:6px}
.day{background:var(--card);border:1px solid var(--line);border-radius:10px;min-height:380px;display:flex;flex-direction:column}
.day.today{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.day.over{background:var(--goldsoft)}
.dh{padding:10px;border-bottom:1px solid var(--line);border-top:4px solid var(--green);border-radius:10px 10px 0 0}
.dh.normal{border-top-color:var(--amber)}.dh.busy{border-top-color:var(--red)}
.dn{font-family:'Cormorant Garamond',Georgia,serif;font-size:19px;font-weight:700}
.dd{color:var(--mute);font-size:12px;margin-bottom:6px}
.dh select{padding:4px 6px;font-size:12px}
.slot{padding:8px;flex:1;display:flex;flex-direction:column;gap:6px}
.item{background:var(--bg);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:6px;padding:6px 8px;cursor:grab;display:flex;justify-content:space-between;gap:6px;font-size:13px}
.item b{display:block;font-size:11px;color:var(--gold)}
.item.dragging{opacity:.4}
.x{border:0;padding:0 2px;color:var(--mute)}
.empty{color:var(--mute);font-size:12px;font-style:italic}
.tray{min-height:50px;display:flex;flex-wrap:wrap;gap:8px;padding:8px;border:1px dashed var(--line);border-radius:6px}
.tray .item{min-width:160px}
.rem{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.rem span{flex:1}.rem small{color:var(--mute);display:block}
#alert{position:fixed;inset:0;background:rgba(7,13,31,.82);display:none;align-items:center;justify-content:center;z-index:99;padding:20px}
#alert.on{display:flex}
.box{background:var(--card);border:2px solid var(--gold);border-radius:14px;padding:26px;max-width:460px;width:100%;text-align:center;animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(184,146,58,.25)}}
.box h3{font-family:'Cormorant Garamond',Georgia,serif;font-size:26px;margin:0 0 4px}
.box .who{color:var(--gold);font-size:12px;letter-spacing:.2em;text-transform:uppercase;margin-bottom:14px}
.al{padding:10px;border:1px solid var(--line);border-radius:8px;margin:8px 0;display:flex;gap:12px;align-items:center;text-align:left}
.al span{flex:1}
.tick{font-size:22px;width:46px;height:46px;border-radius:50%;background:var(--green);color:#fff;border:0;padding:0}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>Marcello’s Private Schedule<small>♔ Personal Office</small></h1>
    <div id="sync">Connecting…</div>
  </div>
  <div class="tabs">
    <button class="tab" data-p="schedule">Schedule</button>
    <button class="tab" data-p="secretary">Private Secretary<span class="n" id="badge" hidden></span></button>
    <button class="tab" data-p="notes">Notes</button>
  </div>
</header>
<main>
  <section class="page" id="p-schedule">
    <div class="panel">
      <h2>Reminders <a href="#secretary" style="float:right;font:500 12px Inter,sans-serif;color:var(--gold)">+ Set a reminder</a></h2>
      <div id="remsTop"></div>
    </div>
    <div class="panel">
      <h2>New Schedule</h2>
      <div class="form">
        <div><label>Title</label><input id="nt" placeholder="e.g. Board meeting"></div>
        <div><label>Time</label><input id="ntime" type="time"></div>
        <div><label>Day</label><select id="nday"></select></div>
        <button class="gold" id="addItem">Add</button>
      </div>
      <label style="margin-top:14px">Unscheduled — drag to a day</label>
      <div class="tray" id="tray"></div>
    </div>
    <div class="nav" style="justify-content:center;margin-bottom:12px">
      <button id="prev">‹ Prev</button><div class="range" id="range"></div><button id="next">Next ›</button><button id="todayBtn">This week</button>
    </div>
    <div class="week" id="week"></div>
  </section>

  <section class="page" id="p-secretary">
    <div style="max-width:560px;margin:auto">
      <div class="panel">
        <h2>Private Secretary</h2>
        <div class="empty">Your Private Secretary will remind you at the chosen time, and will not stop until you press the tick.</div>
        <label>Remind me</label><input id="rt" placeholder="e.g. Call the bank">
        <label>Date</label><input id="rd" type="date">
        <label>At (time)</label><input id="rtime" type="time">
        <button class="gold" style="width:100%;margin-top:12px" id="addRem">Set reminder</button>
      </div>
    </div>
  </section>

  <section class="page" id="p-notes">
    <div class="panel">
      <h2>Notes</h2>
      <textarea id="notes" placeholder="Things to remember…"></textarea>
    </div>
  </section>
</main>
<div id="alert"><div class="box"><h3>A reminder, Sir</h3><div class="who">Private Secretary</div><div id="alist"></div></div></div>
<script>
const DAYS=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const $=id=>document.getElementById(id);

// ---- Supabase (hardcoded) ----
const SB_URL='https://kijceuswjfclnyudcguj.supabase.co/rest/v1/app_state';
const SB_KEY='sb_publishable_4waBF38hDWXKxi6ycUrpgg_yOg0AL_G';
const ROW_ID='marcello';
const HDR={apikey:SB_KEY,'Content-Type':'application/json'};
function status(t,c){const s=$('sync');s.textContent=t;s.className=c||''}

let S={items:[],busy:{},notes:'',rems:[]};
try{const r=localStorage.getItem('marcello-schedule');if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}

let pushTimer=null;
function push(){
  clearTimeout(pushTimer);status('Saving…');
  pushTimer=setTimeout(async()=>{
    try{
      const r=await fetch(SB_URL+'?on_conflict=id',{method:'POST',
        headers:{...HDR,Prefer:'resolution=merge-duplicates,return=minimal'},
        body:JSON.stringify({id:ROW_ID,data:S,updated_at:new Date().toISOString()})});
      if(!r.ok)throw new Error(r.status);
      pushTimer=null;status('Synced','ok');
    }catch(e){pushTimer=null;status('Offline — saved on this device','err')}
  },600);
}
const save=()=>{try{localStorage.setItem('marcello-schedule',JSON.stringify(S))}catch(e){}push()};

async function pull(){
  if(pushTimer)return;
  try{
    const r=await fetch(SB_URL+'?id=eq.'+ROW_ID+'&select=data',{headers:HDR});
    if(!r.ok)throw new Error(r.status);
    const rows=await r.json();
    if(rows.length&&rows[0].data&&Object.keys(rows[0].data).length){
      S=Object.assign({items:[],busy:{},notes:'',rems:[]},rows[0].data);
      try{localStorage.setItem('marcello-schedule',JSON.stringify(S))}catch(e){}
      $('notes').value=S.notes||'';render();check();status('Synced','ok');
    }else push();
  }catch(e){status('Offline — saved on this device','err')}
}

const key=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const uid=()=>Math.random().toString(36).slice(2,9);
function monday(d){const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
let start=monday(new Date());
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let dragId=null;

// pages
const PAGES=['schedule','secretary','notes'];
function show(){
  let p=location.hash.slice(1);if(!PAGES.includes(p))p='schedule';
  PAGES.forEach(n=>{$('p-'+n).classList.toggle('on',n===p)});
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.p===p));
}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{location.hash=t.dataset.p});
window.addEventListener('hashchange',show);

function itemEl(it){
  const e=document.createElement('div');e.className='item';e.draggable=true;
  e.innerHTML='<div>'+(it.time?'<b>'+it.time+'</b>':'')+esc(it.title)+'</div><button class="x" title="Delete">✕</button>';
  e.ondragstart=()=>{dragId=it.id;e.classList.add('dragging')};
  e.ondragend=()=>e.classList.remove('dragging');
  e.querySelector('.x').onclick=()=>{S.items=S.items.filter(i=>i.id!==it.id);save();render()};
  return e;
}
function drop(el,date){
  el.ondragover=ev=>{ev.preventDefault();el.classList.add('over')};
  el.ondragleave=()=>el.classList.remove('over');
  el.ondrop=ev=>{ev.preventDefault();el.classList.remove('over');const it=S.items.find(i=>i.id===dragId);if(it){it.date=date;save();render()}};
}
const byTime=(a,b)=>(a.time||'99').localeCompare(b.time||'99');

function render(){
  const end=new Date(start);end.setDate(end.getDate()+6);
  $('range').textContent='Mon '+start.getDate()+' '+MON[start.getMonth()]+' – Sun '+end.getDate()+' '+MON[end.getMonth()]+' '+end.getFullYear();
  const w=$('week');w.innerHTML='';
  const sel=$('nday'),cur=sel.value;sel.innerHTML='<option value="">Unscheduled</option>';
  for(let i=0;i<7;i++){
    const d=new Date(start);d.setDate(d.getDate()+i);const k=key(d);
    sel.innerHTML+='<option value="'+k+'">'+DAYS[i]+' '+d.getDate()+' '+MON[d.getMonth()]+'</option>';
    const lv=S.busy[k]||'normal';
    const col=document.createElement('div');col.className='day'+(k===key(new Date())?' today':'');
    col.innerHTML='<div class="dh '+(lv==='free'?'':lv)+'"><div class="dn">'+DAYS[i]+'</div><div class="dd">'+d.getDate()+' '+MON[d.getMonth()]+'</div><select><option value="free">Not busy</option><option value="normal">Normal</option><option value="busy">Busy</option></select></div><div class="slot"></div>';
    const s=col.querySelector('select');s.value=lv;
    s.onchange=()=>{S.busy[k]=s.value;save();render()};
    const slot=col.querySelector('.slot');
    const list=S.items.filter(x=>x.date===k).sort(byTime);
    list.forEach(it=>slot.appendChild(itemEl(it)));
    if(!list.length)slot.innerHTML='<div class="empty">Free — drop here</div>';
    drop(col,k);w.appendChild(col);
  }
  sel.value=[...sel.options].some(o=>o.value===cur)?cur:'';
  const tray=$('tray');tray.innerHTML='';
  S.items.filter(i=>!i.date).forEach(it=>tray.appendChild(itemEl(it)));
  if(!tray.children.length)tray.innerHTML='<div class="empty">Nothing waiting</div>';
  drop(tray,null);
  renderRems();
}
function renderRems(){
  const n=S.rems.filter(x=>!x.done).length;$('badge').hidden=!n;$('badge').textContent=n;
  const t=$('remsTop');t.innerHTML='';
  S.rems.filter(x=>!x.done).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).forEach(x=>{
    const e=document.createElement('div');e.className='rem';
    e.innerHTML='<span>'+esc(x.text)+'<small>'+x.date+' · '+x.time+'</small></span><button class="tick" style="width:34px;height:34px;font-size:16px" title="Done">✓</button>';
    e.querySelector('button').onclick=()=>{x.done=true;save();renderRems();check()};
    t.appendChild(e);
  });
  if(!t.children.length)t.innerHTML='<div class="empty">No pending reminders</div>';
}
$('addItem').onclick=()=>{
  const t=$('nt').value.trim();if(!t)return;
  S.items.push({id:uid(),title:t,time:$('ntime').value,date:$('nday').value||null});
  $('nt').value='';$('ntime').value='';save();render();
};
$('nt').onkeydown=e=>{if(e.key==='Enter')$('addItem').click()};
$('prev').onclick=()=>{start.setDate(start.getDate()-7);render()};
$('next').onclick=()=>{start.setDate(start.getDate()+7);render()};
$('todayBtn').onclick=()=>{start=monday(new Date());render()};
$('notes').value=S.notes||'';
$('notes').oninput=e=>{S.notes=e.target.value;save()};
$('rd').value=key(new Date());

// Private Secretary reminders
let ac=null;
function beep(){
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    [880,1175].forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.connect(g);g.connect(ac.destination);
      const t=ac.currentTime+i*.25;g.gain.setValueAtTime(.2,t);g.gain.exponentialRampToValueAtTime(.001,t+.4);o.start(t);o.stop(t+.4)})}catch(e){}
}
$('addRem').onclick=()=>{
  const t=$('rt').value.trim(),d=$('rd').value,tm=$('rtime').value;
  if(!t||!d||!tm){alert('Please enter the reminder, date and time.');return}
  S.rems.push({id:uid(),text:t,date:d,time:tm,done:false});
  $('rt').value='';save();renderRems();beep();
  try{if('Notification' in window&&Notification.permission==='default')Notification.requestPermission()}catch(e){}
};
function due(){const n=new Date(),now=key(n)+n.toTimeString().slice(0,5);return S.rems.filter(r=>!r.done&&(r.date+r.time)<=now)}
let last=0,sig='',flash=null;const TITLE=document.title;
function check(){
  const d=due(),box=$('alert');
  if(!d.length){
    box.classList.remove('on');sig='';
    if(flash){clearInterval(flash);flash=null;document.title=TITLE}
    return;
  }
  // rebuild only when the set of due reminders changes, so the Done button stays clickable
  const s2=d.map(r=>r.id).join(',');
  if(s2!==sig){
    sig=s2;
    const list=$('alist');list.innerHTML='';
    d.forEach(r=>{
      const e=document.createElement('div');e.className='al';
      e.innerHTML='<span><b>'+esc(r.text)+'</b><br><small>Set for '+r.date+' '+r.time+'. I shall keep reminding you until it is done, Sir.</small></span><button class="tick" title="Done">✓</button>';
      e.querySelector('.tick').onclick=()=>{r.done=true;save();renderRems();check()};
      list.appendChild(e);
    });
  }
  box.classList.add('on');
  if(!flash){let on=false;flash=setInterval(()=>{on=!on;document.title=on?'🔔 REMINDER: '+d[0].text:TITLE},900)}
  if(Date.now()-last>4000){last=Date.now();beep();
    try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}
    try{if('Notification' in window&&Notification.permission==='granted')new Notification('Private Secretary',{body:d[0].text,tag:'secretary',renotify:true,requireInteraction:true})}catch(e){}}
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('alert').classList.contains('on'))e.preventDefault()});
setInterval(check,1000);
document.addEventListener('click',()=>{try{ac=ac||new (window.AudioContext||window.webkitAudioContext)()}catch(e){}},{once:true});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull()});
show();render();check();pull();
</script>
</body>
</html>
